[project]
name = "python-kuleuven"
version = "0.1.0"
description = "KU Leuven CLI, an MCP, and a Python library"
readme = "README.md"
authors = [
    { name = "Ilia Breitburg", email = "me@breitburg.com" }
]
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "claude-desktop-config>=0.2.1",
    "httpx>=0.28.1",
    "markitdown>=0.1.5",
    "platformdirs>=4.9.6",
    "pycli-mcp>=0.3.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "typer>=0.25.1",
    "websocket-client>=1.9.0",
]

[project.scripts]
kuleuven = "kuleuven.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kuleuven"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "respx>=0.23.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.uv.sources]
pycli-mcp = { git = "https://github.com/breitburg/pycli-mcp.git", rev = "support-typer-0.26-vendored-click" }
